# Deploys Cloud Run on every push to main (after the tests pass) once ./setup-github-deploy.sh has
# been run: it sets the repository variables below and a keyless Workload Identity connection.
# Without them this workflow is skipped. Environment variables and secrets set by deploy.sh are kept.
name: Deploy to Cloud Run
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  test:
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q --ignore=tests/ui
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy
        run: |
          gcloud run deploy "${{ vars.GCP_SERVICE || 'data-cloud-compass' }}" --source . \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION || 'us-central1' }}" \
            --update-env-vars "APP_VERSION=${GITHUB_SHA::7}" --quiet
      - name: Smoke test
        run: |
          URL=$(gcloud run services describe "${{ vars.GCP_SERVICE || 'data-cloud-compass' }}" --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION || 'us-central1' }}" --format='value(status.url)')
          curl -fsS "$URL/healthz"
          curl -fsS -X POST "$URL/api/estimate" -H 'Content-Type: application/json' -d @samples/retail-bank-ksa.json | head -c 200
