# Publishes the static, serverless demo (demo/dist/index.html) to the gh-pages branch.
# GitHub Pages serves it from Settings -> Pages -> Deploy from a branch: gh-pages / (root).
name: Demo on GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python demo/build_demo.py
      - run: mkdir -p _site/vendor && cp demo/dist/index.html _site/index.html && cp app/static/vendor/docx.min.js _site/vendor/ && touch _site/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
