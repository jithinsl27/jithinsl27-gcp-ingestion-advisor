# Publishes the public demo (same front end, calling the Cloud Run service) to the gh-pages branch.
# Set the repository variable COMPASS_API_URL to your Cloud Run URL (deploy.sh prints the command).
name: Demo on GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q --ignore=tests/ui
      - run: python demo/build_demo.py
        env:
          # the repository variable wins; otherwise the project's Cloud Run service
          COMPASS_API_URL: ${{ vars.COMPASS_API_URL || 'https://data-cloud-compass-jtscxxu3wa-uc.a.run.app' }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./demo/dist
          publish_branch: gh-pages
